name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.local/share/python-for-android
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev libreadline-dev wget cmake \
            build-essential python3 python3-pip python3-dev \
            ccache libltdl-dev
          sudo apt clean

      - name: Install buildozer and python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython==0.29.37

      - name: Configure Gradle Mirror
        run: |
          mkdir -p ~/.gradle
          echo "allprojects{ repositories { maven { url 'https://maven.aliyun.com/repository/public' } google() mavenCentral() } }" > ~/.gradle/init.gradle

      - name: Build APK with Buildozer
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer -v android debug 2>&1 | tee build.log
        working-directory: ${{github.workspace}}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BarcodePDFApp-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 7
